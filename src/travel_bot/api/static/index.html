<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Intake</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --user:#e8efff; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --panel:#171b23; --text:#e6e8ee; --muted:#9aa3b2; --accent:#6c9cff; --user:#1f2a44; --border:#2a3040; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:860px) { main { grid-template-columns:2fr 1fr; } }
  section { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; } h2 { font-size:15px; margin:0 0 8px; }
  #log { height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .user { background:var(--user); align-self:flex-end; } .bot { border:1px solid var(--border); align-self:flex-start; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:4px; border-bottom:1px solid var(--border); vertical-align:top; }
  .st { color:var(--muted); font-size:12px; } small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <section>
    <h1>Trip planner</h1>
    <div id="log"></div>
    <form id="f"><input id="t" autocomplete="off" placeholder="Say hi, or tell me about your trip…" maxlength="2000"><button>Send</button></form>
    <small id="status"></small>
  </section>
  <section><h2>Captured details</h2><table id="ents"></table><p><button id="reset" type="button">New session</button></p></section>
</main>
<script>
const log = document.getElementById('log'), input = document.getElementById('t');
let sess = null;
try { sess = JSON.parse(sessionStorage.getItem('travel_session')); } catch (e) {}

function add(role, text) { const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
async function newSession() {
  const r = await fetch('/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
  sess = await r.json(); try { sessionStorage.setItem('travel_session', JSON.stringify(sess)); } catch (e) {}
  log.innerHTML = ''; refresh();
}
const headers = () => ({ 'Content-Type': 'application/json', 'X-Session-Token': sess.session_token });
async function refresh() {
  const r = await fetch(`/sessions/${sess.session_id}/entities`, { headers: headers() });
  if (!r.ok) return;
  const data = await r.json();
  document.getElementById('status').textContent = `Session: ${data.session_status}`;
  document.getElementById('ents').innerHTML = data.entities.filter(e => e.status !== 'missing')
    .map(e => `<tr><td>${e.label}</td><td>${escapeHtml(JSON.stringify(e.value ?? ''))}<div class="st">${e.status}${e.user_confirmed ? ' · confirmed' : ''}</div></td></tr>`).join('');
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function loadHistory() {
  const r = await fetch(`/sessions/${sess.session_id}/messages`, { headers: headers() });
  if (!r.ok) return newSession();
  (await r.json()).forEach(m => add(m.role === 'user' ? 'user' : 'bot', m.content)); refresh();
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return;
  input.value = ''; add('user', text);
  const r = await fetch(`/sessions/${sess.session_id}/messages`, { method: 'POST', headers: headers(),
    body: JSON.stringify({ message_id: crypto.randomUUID(), content: text }) });
  const data = await r.json();
  add('bot', r.ok ? data.reply : (data.detail || 'Something went wrong.')); refresh();
};
document.getElementById('reset').onclick = newSession;
sess ? loadHistory() : newSession();
</script>
</body>
</html>
