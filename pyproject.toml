[project]
name = "travel-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Lakshitha", email = "rpldeshan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.146.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langdetect>=1.0.9",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.5",
    "tenacity>=9.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
travel-bot = "travel_bot.cli:main"
travel-bot-api = "travel_bot.api.app:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
